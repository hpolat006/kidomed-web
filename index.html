<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kidomed</title>
<style>
  :root{ --mint:#EEF5F3; --card:#fff; --ink:#12332B; --muted:#5C6B66;
         --teal:#0F6E56; --tealbg:#CDEBE0; --line:#DCE9E4; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--mint); color:var(--ink); min-height:100vh;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        line-height:1.6; display:flex; align-items:center; justify-content:center; }
  .wrap{ max-width:520px; margin:0 auto; padding:40px 24px; text-align:center; }
  .logo{ width:64px; height:64px; border-radius:18px; background:var(--teal);
         color:#fff; display:flex; align-items:center; justify-content:center;
         font-weight:800; font-size:32px; margin:0 auto 14px; }
  .brand{ font-weight:800; font-size:30px; }
  .brand span{ color:var(--teal); }
  .tag{ color:var(--muted); margin:6px 0 26px; }
  a.link{ display:block; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:16px 20px; margin:12px 0; text-decoration:none;
          color:var(--ink); font-weight:600; text-align:left; }
  a.link small{ display:block; color:var(--muted); font-weight:400; font-size:13px; margin-top:2px; }
  footer{ color:var(--muted); font-size:13px; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">K</div>
  <div class="brand">Kido<span>med</span></div>
  <div class="tag">Bebeğiniz için sıcaklık takibi</div>

  <a class="link" href="gizlilik-politikasi.html">Gizlilik Politikası
    <small>Hangi verileri neden işliyoruz</small></a>
  <a class="link" href="hesap-silme.html">Hesap ve Veri Silme
    <small>Bulut hesabını ve verini nasıl silersin</small></a>

  <footer>© 2026 Kidomed</footer>
</div>
</body>
</html>
